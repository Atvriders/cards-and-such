# CI-only override — adds local build capability back on top of the
# pull-only docker-compose.yml. Used by the e2e CI job to exercise the
# current source tree without pulling the previous commit's image.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

services:
  server:
    pull_policy: build
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # E2E hammers /auth/claim from a single docker network IP; the prod
      # default (20/hour) trips after ~half the suite. Loosen for CI runs.
      CLAIM_RATE_MAX: "1000"
      RESUME_RATE_MAX: "1000"

  web:
    pull_policy: build
    build:
      context: .
      dockerfile: web/Dockerfile
