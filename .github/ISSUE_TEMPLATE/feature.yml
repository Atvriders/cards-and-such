name: Feature request
description: Suggest a new game, mechanic, or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the idea so we can evaluate scope and fit.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve, or what experience does it improve?
      placeholder: I often want to ... but currently ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature, game, or change you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, and why they are worse.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New game
        - New variant of an existing game
        - UI / UX improvement
        - Engine / shared module
        - Tooling / CI / docs
        - Other
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to rules, screenshots, or prior art.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
        - label: I am willing to help test or implement this if guidance is provided.
          required: false
