name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel any older in-progress runs on the same ref when a new commit lands.
# Stops the 1,800-deep queue scenario from ever recurring and keeps mainline
# CI focused on the latest tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck + shared/server tests + production build — single runner, fast
  # path (~8 min). Decoupled from the web vitest sweep so the slow piece
  # doesn't block these.
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --workspaces --include-workspace-root
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm -w @cards/shared run test
      - run: npm -w @cards/server run test
      - run: npm run build

  # Web vitest sharded 4 ways so the ~7,000-file suite runs in parallel.
  # Wall-clock drops from ~2:30h to ~25-30 min. Costs 4× runner-minutes
  # during the test phase, which is comfortably inside the free-tier
  # budget at this commit cadence.
  unit-web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --workspaces --include-workspace-root
      - run: npm -w @cards/web run test -- --shard=${{ matrix.shard }}/4

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-build, unit-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --workspaces --include-workspace-root
      - name: Build & start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Wait for health
        run: |
          ok=0
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3050/api/health; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "Health check failed after 30 attempts; dumping logs:"
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
            exit 1
          fi
      - run: npm -w @cards/e2e run test:install
      - run: npm -w @cards/e2e run test
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
